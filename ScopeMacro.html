  .file-meta {

    color: var(--text-muted);
  }

  .file-actions-btn {

    height: 34px;

    background: none;
    color: var(--text-muted);
    font-size: 20px;

    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;

    padding: 60px 20px;
    color: var(--text-muted);
  }

  .editor-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .back-btn {
    width: 36px; height: 36px;
    border: none; background: none;
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    border-radius: 8px;
    flex-shrink: 0;
  }

  .editor-title {
    flex: 1;
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .editor-actions { display: flex; gap: 8px; }

  .icon-btn {
    height: 36px;
    padding: 0 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .icon-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .editor-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px calc(var(--safe-bottom) + 120px);

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }

  .field-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);

  .field-input {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--border);

    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    color: var(--text-primary);
    padding: 4px 0 8px;
    outline: none;
    margin-bottom: 18px;
    transition: border-color 0.2s;

  .field-input:last-child { margin-bottom: 0; }

  .room-header {

    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    letter-spacing: 1px;
  }

  /* Autocomplete dropdown */
  .autocomplete-wrapper {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  .autocomplete-dropdown {
    position: absolute;
    top: calc(100% + 2px);
    left: -18px;
    right: -50px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    z-index: 100;
    max-height: 200px;
    overflow-y: auto;
    display: none;
  }

  .autocomplete-dropdown.open { display: block; }

  .autocomplete-item {
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text-primary);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:active, .autocomplete-item.highlighted { background: var(--accent-light); }

  .autocomplete-item em {
    font-style: normal;
    font-weight: 600;
    color: var(--accent);
  }

  .room-footer {
    padding: 10px 18px 14px;
    border-top: 1px solid var(--border);
  }

  .add-item-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
  }

  .section-header-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px 6px;
    border-top: 1px solid var(--border);
    background: #FAFAF8;
  }

  .section-header-row:first-child { border-top: none; }

  .section-header-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--text-secondary);
    flex: 1;
  }

  .section-add-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }

  .section-items-list {
    padding: 2px 0 6px;
  }

  .add-room-btn {
    width: 100%;
    height: 50px;
    background: var(--surface);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-secondary);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: border-color 0.2s, color 0.2s;
  }

  .add-room-btn:active { border-color: var(--accent); color: var(--accent); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: var(--safe-bottom);

    max-width: 500px;
    padding: 20px 20px calc(20px + var(--safe-bottom));

    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {

    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;

    font-size: 16px;
    color: var(--text-primary);
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  .modal-input:focus { border-color: var(--accent); }

  .modal-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }

  .modal-btn.confirm { background: var(--accent); color: white; }
  .modal-btn.cancel { background: var(--bg); color: var(--text-secondary); }
  .modal-btn.danger { background: var(--danger-light); color: var(--danger); }

  .action-list { display: flex; flex-direction: column; gap: 8px; }

  .action-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--bg);
    border-radius: 12px;
    border: none;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: var(--text-primary);
    cursor: pointer;
    text-align: left;
  }

  .action-item.danger { color: var(--danger); }
  .action-icon { font-size: 20px; width: 28px; text-align: center; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 24px);
    left: 50%; transform: translateX(-50%);
    background: var(--text-primary);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; }
</style>
</head>

function getCustomDB() {
  try { return JSON.parse(localStorage.getItem('scopemacro_custom_db') || '[]'); } catch { return []; }
}

function addToCustomDB(item) {
  const trimmed = item.trim();
  if (!trimmed) return;
  const allItems = MASTER_DB.map(s => s.toLowerCase());
  if (allItems.includes(trimmed.toLowerCase())) return;
  const custom = getCustomDB();
  if (custom.map(s => s.toLowerCase()).includes(trimmed.toLowerCase())) return;
  custom.push(trimmed);
  localStorage.setItem('scopemacro_custom_db', JSON.stringify(custom));
}

function searchDB(query) {
  if (!query || query.length < 2) return [];
  const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 0);
  function allWordsMatch(s) {
    const lower = s.toLowerCase();
    return words.every(w => lower.includes(w));
  }
  const masterMatches = MASTER_DB.filter(allWordsMatch);
  const customMatches = getCustomDB().filter(allWordsMatch);
  const combined = [...new Set([...masterMatches, ...customMatches])];
  return combined.slice(0, 12);
}

function highlightMatch(text, query) {
  if (!query) return text;
  const words = query.split(/\s+/).filter(w => w.length > 0);
  let result = escHtml(text);
  words.forEach(word => {
    if (!word) return;
    const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    result = result.replace(new RegExp(escaped, 'gi'), match => '<em>' + match + '</em>');
  });
  return result;
}

// ── STORAGE ──
function getFiles() {
  try { return JSON.parse(localStorage.getItem('scopemacro_files') || '[]'); } catch { return []; }
}

function saveFiles(files) {
  localStorage.setItem('scopemacro_files', JSON.stringify(files));
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// ── CURRENT FILE STATE ──
let currentFile = null;

function autoSave() {
  if (!currentFile) return;
  currentFile.jobName = document.getElementById('job-name').value;
  currentFile.jobAddress = document.getElementById('job-address').value;
  currentFile.name = currentFile.jobName || 'Untitled ScopeMacro';
  document.getElementById('editor-title').textContent = currentFile.name;
  currentFile.updatedAt = Date.now();
  currentFile.rooms = collectRooms();
  const files = getFiles();
  const idx = files.findIndex(f => f.id === currentFile.id);
  if (idx >= 0) files[idx] = currentFile;
  else files.unshift(currentFile);
  saveFiles(files);
}

function collectRooms() {
  const rooms = [];
  document.querySelectorAll('.room-card').forEach(card => {
    const roomId = card.dataset.roomId;
    const roomName = card.querySelector('.room-name-input').value;
    const sections = {};
    SECTION_HEADERS.forEach(sec => {
      const secId = sectionKey(roomId, sec);
      const list = document.getElementById('items-' + secId);
      if (!list) return;
      const items = [];
      list.querySelectorAll('.scope-item-input').forEach(inp => {
        if (inp.value.trim()) items.push(inp.value.trim());
      });
      sections[sec] = items;
    });
    rooms.push({ id: roomId, name: roomName, sections });
  });
  return rooms;
}

// ── HOME ──
function renderFiles(files) {
  const list = document.getElementById('files-list');
  if (!files.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>No ScopeMacros yet.<br>Tap Create New to get started.</p></div>';
    return;
  }
  list.innerHTML = files.map(f => {
    const date = new Date(f.updatedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const rooms = (f.rooms || []).length;
    return `<div class="file-card" onclick="openFile('${f.id}')">
      <div class="file-icon">📄</div>
      <div class="file-info">
        <div class="file-name">${escHtml(f.name)}</div>
        <div class="file-meta">${rooms} room${rooms !== 1 ? 's' : ''} · ${date}</div>
      </div>
      <button class="file-actions-btn" onclick="event.stopPropagation(); showFileActions('${f.id}')">⋯</button>
    </div>`;
  }).join('');
}

function filterFiles() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const files = getFiles();
  const filtered = q ? files.filter(f => f.name.toLowerCase().includes(q)) : files;
  renderFiles(filtered);
}

function goHome() {
  autoSave();
  currentFile = null;
  showScreen('home-screen');
  renderFiles(getFiles());
  document.getElementById('search-input').value = '';
}

// ── CREATE / OPEN ──
function createNew() {
  currentFile = {
    id: generateId(),
    name: 'Untitled ScopeMacro',
    jobName: '',
    jobAddress: '',
    rooms: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  loadEditor(currentFile);
  showScreen('editor-screen');
}

function openFile(id) {
  const files = getFiles();
  const file = files.find(f => f.id === id);
  if (!file) return;
  currentFile = JSON.parse(JSON.stringify(file));
  loadEditor(currentFile);
  showScreen('editor-screen');
}

function loadEditor(file) {
  document.getElementById('job-name').value = file.jobName || '';
  document.getElementById('job-address').value = file.jobAddress || '';
  document.getElementById('editor-title').textContent = file.name;
  const container = document.getElementById('rooms-container');
  container.innerHTML = '';
  (file.rooms || []).forEach(r => renderRoom(r.id, r.name, r.sections || {}));
}

// ── ROOMS ──
function addRoom() {
  autoSave();
  const id = generateId();
  renderRoom(id, '', []);
  autoSave();
  // Scroll to new room
  setTimeout(() => {
    const cards = document.querySelectorAll('.room-card');
    const last = cards[cards.length - 1];
    if (last) { last.scrollIntoView({ behavior: 'smooth', block: 'start' }); last.querySelector('.room-name-input').focus(); }
  }, 100);
}

const SECTION_HEADERS = ['Floor','Wall','Ceiling','Windows & Doors','Millwork','MEPs','Miscellaneous'];

function renderRoom(id, name, sections) {
  const container = document.getElementById('rooms-container');
  const card = document.createElement('div');
  card.className = 'room-card';
  card.dataset.roomId = id;

  let sectionsHtml = SECTION_HEADERS.map(sec => {
    const secId = sectionKey(id, sec);
    const secAttr = sec.replace(/&/g, '&amp;').replace(/'/g, '&#39;');
    return `<div class="section-header-row">
      <span class="section-header-label">${sec}</span>
      <button class="section-add-btn" data-room="${id}" data-section="${secAttr}" onclick="addScopeItemFromBtn(this)">＋ Add</button>
    </div>
    <div class="section-items-list" id="items-${secId}"></div>`;
  }).join('');

  card.innerHTML = `
    <div class="room-header">
      <input class="room-name-input" type="text" placeholder="Room Name" value="${escHtml(name)}" oninput="autoSave()">
      <button class="room-delete-btn" onclick="deleteRoom('${id}')">✕</button>
    </div>
    ${sectionsHtml}
  `;
  container.appendChild(card);

  // Populate saved items
  if (sections && typeof sections === 'object') {
    SECTION_HEADERS.forEach(sec => {
      const items = sections[sec] || [];
      items.forEach(item => addScopeItem(id, item, '', sec, true));
    });
  }
}

function sectionKey(roomId, section) {
  return roomId + '_' + section.replace(/[^a-z0-9]/gi, '_');
}

function deleteRoom(id) {
  showModal(`<div class="modal-handle"></div>
    <div class="modal-title">Delete Room?</div>
    <p style="color:var(--text-secondary);margin-bottom:20px;font-size:15px">This will remove the room and all its scope items.</p>
    <button class="modal-btn danger" onclick="confirmDeleteRoom('${id}')">Delete Room</button>
    <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>`);
}

function confirmDeleteRoom(id) {
  closeModal();
  const card = document.querySelector(`.room-card[data-room-id="${id}"]`);
  if (card) card.remove();
  autoSave();
}

// ── SCOPE ITEMS ──
function addScopeItemFromBtn(btn) {
  const roomId = btn.dataset.room;
  const section = btn.dataset.section;
  addScopeItem(roomId, '', '', section);
}

function addScopeItem(roomId, value, afterRowId, section, silent) {
  const listId = section ? 'items-' + sectionKey(roomId, section) : null;
  const list = listId ? document.getElementById(listId) : null;
  if (!list) return;
  const rowId = generateId();
  const row = document.createElement('div');
  row.className = 'scope-item-row';
  row.dataset.rowId = rowId;
  row.innerHTML = `
    <div class="scope-bullet"></div>
    <div class="autocomplete-wrapper" id="ac-wrapper-${rowId}">
      <input class="scope-item-input" type="text" placeholder="Type scope item..." value="${escHtml(value || '')}"
        oninput="onScopeInput(this, '${rowId}')"
        onblur="onScopeBlur(this, '${rowId}')"
        onkeydown="onScopeKeydown(event, '${rowId}')"
        onfocus="onScopeInput(this, '${rowId}')">
      <div class="autocomplete-dropdown" id="ac-${rowId}"></div>
    </div>
    <button class="scope-item-delete" onclick="showItemActions('${rowId}')">⋯</button>
  `;
  if (afterRowId) {
    const afterEl = list.querySelector(`.scope-item-row[data-row-id="${afterRowId}"]`);
    if (afterEl && afterEl.nextSibling) {
      list.insertBefore(row, afterEl.nextSibling);
    } else if (afterEl) {
      list.appendChild(row);
    } else {
      list.appendChild(row);
    }
  } else {
    list.appendChild(row);
  }
  if (!value) {
    setTimeout(() => row.querySelector('.scope-item-input').focus(), 50);
  }
}

function showItemActions(rowId) {
  const row = document.querySelector(`.scope-item-row[data-row-id="${rowId}"]`);
  if (!row) return;
  const input = row.querySelector('.scope-item-input');
  const currentVal = input ? input.value : '';
  // Find which room this item belongs to
  const roomCard = row.closest('.room-card');
  const roomId = roomCard ? roomCard.dataset.roomId : null;
  showModal(`<div class="modal-handle"></div>
    <div class="modal-title" style="font-size:16px;margin-bottom:16px">${escHtml(currentVal) || 'Scope Item'}</div>
    <div class="action-list">
      <button class="action-item" onclick="closeModal(); editScopeItem('${rowId}')"><span class="action-icon">✏️</span> Edit</button>
      <button class="action-item" onclick="closeModal(); insertItemAfter('${roomId}', '${rowId}', getSectionOfRow('${rowId}'))"><span class="action-icon">➕</span> Insert Item After</button>
      <button class="action-item danger" onclick="closeModal(); deleteScopeItem('${rowId}')"><span class="action-icon">🗑</span> Delete</button>
    </div>
    <button class="modal-btn cancel" style="margin-top:12px" onclick="closeModal()">Cancel</button>`);
}

function editScopeItem(rowId) {
  const row = document.querySelector(`.scope-item-row[data-row-id="${rowId}"]`);
  if (!row) return;
  const input = row.querySelector('.scope-item-input');
  if (input) { input.focus(); input.select(); }
}

function getSectionOfRow(rowId) {
  const row = document.querySelector(`.scope-item-row[data-row-id="${rowId}"]`);
  if (!row) return null;
  const list = row.closest('.section-items-list');
  if (!list) return null;
  // list id is items_ROOMID_SECTIONNAME
  for (const sec of SECTION_HEADERS) {
    if (list.id.endsWith('_' + sec.replace(/[^a-z0-9]/gi, '_'))) return sec;
  }
  return null;
}

function insertItemAfter(roomId, afterRowId, section) {
  const secId = section ? sectionKey(roomId, section) : null;
  const list = secId ? document.getElementById('items-' + secId) : null;
  if (!list) return;
  const newRowId = generateId();
  const row = document.createElement('div');
  row.className = 'scope-item-row';
  row.dataset.rowId = newRowId;
  row.innerHTML = `
    <div class="scope-bullet"></div>
    <div class="autocomplete-wrapper" id="ac-wrapper-${newRowId}">
      <input class="scope-item-input" type="text" placeholder="Type scope item..."
        oninput="onScopeInput(this, '${newRowId}')"
        onblur="onScopeBlur(this, '${newRowId}')"
        onkeydown="onScopeKeydown(event, '${newRowId}')"
        onfocus="onScopeInput(this, '${newRowId}')">
      <div class="autocomplete-dropdown" id="ac-${newRowId}"></div>
    </div>
    <button class="scope-item-delete" onclick="showItemActions('${newRowId}')">⋯</button>
  `;
  const afterEl = list.querySelector(`.scope-item-row[data-row-id="${afterRowId}"]`);
  if (afterEl && afterEl.nextSibling) {
    list.insertBefore(row, afterEl.nextSibling);
  } else {
    list.appendChild(row);
  }
  setTimeout(() => row.querySelector('.scope-item-input').focus(), 50);
  autoSave();
}

function deleteScopeItem(rowId) {
  const row = document.querySelector(`.scope-item-row[data-row-id="${rowId}"]`);
  if (row) { row.remove(); autoSave(); }
}

// ── AUTOCOMPLETE ──
let activeDropdownId = null;
let highlightedIndex = -1;

function onScopeInput(input, rowId) {
  const query = input.value;
  const dropdown = document.getElementById('ac-' + rowId);
  const results = searchDB(query);
  if (!results.length || !query.trim()) {
    dropdown.classList.remove('open');
    return;
  }
  highlightedIndex = -1;
  activeDropdownId = rowId;
  dropdown.innerHTML = results.map((r, i) =>
    `<div class="autocomplete-item" data-index="${i}" onmousedown="selectScopeItem('${rowId}', this)">${highlightMatch(r, query)}</div>`
  ).join('');
  dropdown.classList.add('open');
}

function onScopeBlur(input, rowId) {
  setTimeout(() => {
    const dropdown = document.getElementById('ac-' + rowId);
    if (dropdown) dropdown.classList.remove('open');
    // Add to custom DB if not in master
    const val = input.value.trim();
    if (val) { addToCustomDB(val); autoSave(); }
  }, 150);
}

function onScopeKeydown(e, rowId) {
  const dropdown = document.getElementById('ac-' + rowId);
  if (!dropdown || !dropdown.classList.contains('open')) return;
  const items = dropdown.querySelectorAll('.autocomplete-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('highlighted', i === highlightedIndex));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightedIndex = Math.max(highlightedIndex - 1, 0);
    items.forEach((el, i) => el.classList.toggle('highlighted', i === highlightedIndex));
  } else if (e.key === 'Enter' && highlightedIndex >= 0) {
    e.preventDefault();
    selectScopeItem(rowId, items[highlightedIndex]);
  } else if (e.key === 'Escape') {
    dropdown.classList.remove('open');
  }
}

function selectScopeItem(rowId, el) {
  const input = document.querySelector(`#ac-wrapper-${rowId} .scope-item-input`);
  // Get plain text (strip <em> tags)
  const text = el.textContent;
  input.value = text;
  document.getElementById('ac-' + rowId).classList.remove('open');
  autoSave();
}

// ── FILE ACTIONS ──
function showFileActions(id) {
  const files = getFiles();
  const file = files.find(f => f.id === id);
  if (!file) return;
  showModal(`<div class="modal-handle"></div>
    <div class="modal-title">${escHtml(file.name)}</div>
    <div class="action-list">
      <button class="action-item" onclick="closeModal(); openFile('${id}')"><span class="action-icon">✏️</span> Edit</button>
      <button class="action-item" onclick="closeModal(); duplicateFile('${id}')"><span class="action-icon">📋</span> Make a Copy</button>
      <button class="action-item danger" onclick="closeModal(); confirmDelete('${id}')"><span class="action-icon">🗑</span> Delete</button>
    </div>
    <button class="modal-btn cancel" style="margin-top:12px" onclick="closeModal()">Cancel</button>`);
}

function duplicateFile(id) {
  const files = getFiles();
  const original = files.find(f => f.id === id);
  if (!original) return;
  showModal(`<div class="modal-handle"></div>
    <div class="modal-title">Name Your Copy</div>
    <input class="modal-input" id="copy-name-input" type="text" value="Copy of ${escHtml(original.name)}" placeholder="File name">
    <button class="modal-btn confirm" onclick="saveDuplicate('${id}')">Create Copy</button>
    <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>`);
  setTimeout(() => { const inp = document.getElementById('copy-name-input'); if (inp) { inp.focus(); inp.select(); }}, 100);
}

function saveDuplicate(id) {
  const files = getFiles();
  const original = files.find(f => f.id === id);
  if (!original) return;
  const nameInput = document.getElementById('copy-name-input');
  const newName = nameInput ? nameInput.value.trim() : 'Copy';
  const copy = JSON.parse(JSON.stringify(original));
  copy.id = generateId();
  copy.name = newName || 'Copy of ' + original.name;
  copy.jobName = copy.jobName || newName;
  copy.createdAt = Date.now();
  copy.updatedAt = Date.now();
  files.unshift(copy);
  saveFiles(files);
  closeModal();
  renderFiles(files);
  showToast('Copy created');
}

function confirmDelete(id) {
  showModal(`<div class="modal-handle"></div>
    <div class="modal-title">Delete ScopeMacro?</div>
    <p style="color:var(--text-secondary);margin-bottom:20px;font-size:15px">This cannot be undone.</p>
    <button class="modal-btn danger" onclick="deleteFile('${id}')">Delete</button>
    <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>`);
}

function deleteFile(id) {
  let files = getFiles();
  files = files.filter(f => f.id !== id);
  saveFiles(files);
  closeModal();
  renderFiles(files);
  showToast('Deleted');
}

function buildPDFContent() {
  autoSave();
  if (!currentFile) return null;
  const jobName = currentFile.jobName || 'ScopeMacro';
  const jobAddress = currentFile.jobAddress || '';
  const rooms = currentFile.rooms || [];

  let inner = `
    <div style="text-align:center; margin-bottom:24px; padding-bottom:12px; border-bottom:2px solid #1A1814;">
      <div style="font-family:'DM Serif Display',serif; font-size:18px; margin-bottom:3px;">${escHtml(jobName)}</div>
      <div style="font-size:11px; color:#6B6560;">${escHtml(jobAddress)}</div>
    </div>`;

  rooms.forEach((room, i) => {
    const isLast = i === rooms.length - 1;
    if (i > 0) {
      inner += `<div style="height:200px; border-bottom:1.5px solid #1A1814; margin-bottom:24px;"></div>`;
    }
    inner += `<div style="margin-bottom:0;">`;
    inner += `<div style="font-family:'DM Serif Display',serif; font-size:12px; border-bottom:1px solid #E2DDD6; padding-bottom:5px; margin-bottom:8px;">${escHtml(room.name || 'Unnamed Room')}</div>`;
    const sections = room.sections || {};
    SECTION_HEADERS.forEach(sec => {
      const items = (sections[sec] || []).filter(s => s.trim());
      if (!items.length) return;
      inner += `<div style="font-size:8px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#6B6560; margin:8px 0 3px;">${escHtml(sec)}</div>`;
      inner += `<ul style="list-style:none; padding:0; margin:0 0 4px;">`;
      items.forEach(item => {
        inner += `<li style="padding:2px 0 2px 12px; font-size:8px; position:relative; border-bottom:1px dotted #E2DDD6; line-height:1.5;"><span style="position:absolute; left:0; color:#2C5F2E;">•</span>${escHtml(item)}</li>`;
      });
      inner += `</ul>`;
    });
    inner += `</div>`;
  });

  return { inner, jobName };
}

function exportPDF() {
  const result = buildPDFContent();
  if (!result) return;
  const overlay = document.getElementById('pdf-preview-overlay');
  document.getElementById('pdf-preview-content').innerHTML = result.inner;
  overlay.style.display = 'flex';
  overlay.scrollTop = 0;
}

function closePDFPreview() {
  document.getElementById('pdf-preview-overlay').style.display = 'none';
}

function printPDF() {
  const content = document.getElementById('pdf-preview-content').innerHTML;
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head>
    <meta charset="UTF-8">
    <title>${escHtml(currentFile ? currentFile.jobName || 'ScopeMacro' : 'ScopeMacro')}</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'DM Sans', sans-serif; margin: 0; padding: 48px; color: #1A1814; background: white; }
      @media print {
        body { padding: 24px; }
        .page-break { page-break-before: always; }
      }
    </style>
  </head><body>${content}</body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 500);
}

// ── MODAL ──
function showModal(html) {
  document.getElementById('modal-sheet').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── UTILS ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──
renderFiles(getFiles());
</script>
